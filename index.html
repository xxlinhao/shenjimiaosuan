      +'这些是<b>同一只基金自身的历史统计</b>，不代表未来。</div>';
  }

  /* ── ⑦ 基金经理与规模 ── */
  h+='<div class="sect">⑦ 基金经理与规模</div>';
  var mi=mgrInfo(f,d);
  if(d.mgr&&d.mgr.length){

     +(s.level==='go'?'🐔':(s.level==='stop'?'🔔':(s.level==='wait'?'🟡':'⚪')))
     +'</div><div class="tx">'+s.label+'</div></div>';

     +'</div></div>';

     +'<div class="c num '+chgCls(navChg)+'">'+(navChg==null?'--':pct(navChg))+'</div></div>';
  h+='</div>';

  h+='<div class="sig-body">';

  /* 今日场内参考（补场外 T-1 缺口） */
  if(d&&d.live&&d.live.chg!=null){
    h+='<div class="live"><span class="tag">'+(d.live.today?'今日盘中参考':'场内最新')+'</span>'

  }

  /* 评分条 */
  h+='<div style="display:flex;align-items:center;gap:8px;margin:10px 0 9px">'
     +'<div style="font-size:10.5px;color:var(--sub);font-weight:700;flex-shrink:0">买点评分</div>'
     +'<div style="flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden">'
     +'<div style="height:100%;width:'+Math.min(100,s.score)+'%;border-radius:3px;background:'
     +(s.score>=60?'var(--go)':(s.score>=45?'var(--wait)':'var(--none)'))+'"></div></div>'
     +'<div style="font-size:13px;font-weight:900;color:'+sigColor(s.level)+'">'+s.score+'</div></div>';

  /* 迷你走势图（60 日复权净值 + 布林通道）：仪表盘只给形状，
     完整的长线位置图（年线 + 半年线）在二级页 */
  h+=spark(d);

  /* 双均线速览：年线管「长期值不值得花钱」，半年线看中期趋势有没有掉头 */
  var dv250=s.detail.dev250, dv120=null, m120s=maWin(d,120);
  if(m120s&&m120s[m120s.length-1]>0&&navNow) dv120=(navNow/m120s[m120s.length-1]-1)*100;
  if(dv250!=null||dv120!=null){
    h+='<div class="dline">'
      +'<span>年线 <b class="'+(dv250==null?'':chgCls(dv250))+'">'+(dv250==null?'--':pct(dv250))+'</b></span>'
      +'<span>半年线 <b class="'+(dv120==null?'':chgCls(dv120))+'">'+(dv120==null?'--':pct(dv120))+'</b></span>'
      +'</div>';
  }

  /* 理由明细、布林带位置条、买点参考价、技术指标网格一律移到二级页
     —— 仪表盘保持「一眼看清该不该动手」，细节点下方入口 */

  /* 建议动作：定投与年线补仓分开列，免得两笔钱混成一个数字看不出补仓动了多少 */
  var exAmt=n(s.detail.amountExtra), bsAmt=n(s.detail.amountBase);

     +'<div class="nt">'+bk+'<br>'+s.act+'</div></div>';

  h+='</div></div>';

function renderHold(){
  var list=funds.filter(function(f){ return f.on!==false; });
  var h='';
  if(!list.length){ document.getElementById('view-hold').innerHTML='<div class="pn"><div class="empty">还没有基金</div></div>'; return; }

  var holdSum=0,costSum=0,dayPnl=0,hasHold=false,oldStyle=0;
  var rows=list.map(function(f){
    var d=dataMap[f.code]||{};
    var s=calcSignal(f);
    var sh=n(f.shares), cost=n(f.cost);
    var mv=mvOf(f,d);
    if(mv!=null){ hasHold=true; holdSum+=mv; costSum+=cost; }
    if(sh<=0 && n(f.holdOld)>0) oldStyle++;
    var pnl=(mv!=null&&cost>0)?(mv-cost):null;
    var pnlPct=(pnl!=null&&cost>0)?(pnl/cost*100):null;
    var dc=dayChgOf(d);
    var dayAmt=(mv!=null&&dc.v!=null)?mv*(dc.v/100)/(1+dc.v/100):null;
    if(dayAmt!=null) dayPnl+=dayAmt;
    return { f:f,d:d,s:s,sh:sh,cost:cost,mv:mv,pnl:pnl,pnlPct:pnlPct,dayAmt:dayAmt,daySrc:dc.src };
  });
  rows.sort(function(a,b){ return (b.mv||0)-(a.mv||0); });
  var daySrcTop=''; rows.some(function(r){ if(r.dayAmt!=null&&r.daySrc){ daySrcTop=r.daySrc; return true; } return false; });

  h+='<div class="kpis">';
  h+='<div class="kpi"><div class="k">总市值</div><div class="v num">'+money(holdSum)+'</div><div class="s">'+rows.filter(function(r){ return r.mv!=null; }).length+' 只有持仓</div></div>';
  h+='<div class="kpi"><div class="k">累计投入</div><div class="v num">'+money(costSum)+'</div><div class="s">按你填写的成本</div></div>';
  h+='<div class="kpi"><div class="k">持有收益</div><div class="v num '+chgCls(hasHold?(holdSum-costSum):null)+'">'
    +(hasHold?((holdSum-costSum)>0?'+':'-')+money(Math.abs(holdSum-costSum)):'--')+'</div>'
    +'<div class="s">'+(hasHold&&costSum>0?pct((holdSum-costSum)/costSum*100):'未填写')+'</div></div>';
  h+='<div class="kpi"><div class="k">当日预估</div><div class="v num '+chgCls(dayPnl)+'">'
    +(hasHold?((dayPnl>0?'+':'-')+money(Math.abs(dayPnl))):'--')+'</div>'
    +'<div class="s">'+(daySrcTop||'按最新净值涨跌')+'</div></div>';
  h+='</div>';

  if(oldStyle>0){
    h+='<div class="warn">你有 '+oldStyle+' 只基金仍是旧版「按金额」记录，市值不会随净值自动更新。点下方「编辑份额与成本」填入持有份额即可。</div>';
  }

  h+='<div class="pn"><h2>💼 持仓明细</h2>'
    +'<div class="tip">市值 = 持有份额 × 最新净值，每天自动更新，不用手改；只需在分红或加仓后点「编辑」更新份额与累计投入。</div>';
  rows.forEach(function(r){
    var share=holdSum>0&&r.mv>0?(r.mv/holdSum*100):null;
    h+='<div class="hcard"><div class="hc-top">';
    h+='<div class="hc-nm">'+esc(r.f.name)+'<span class="c">'+r.f.code+(r.f.cat?' · '+esc(r.f.cat):'')
      +' · 份额 '+fx(r.sh,2)+' · 周投 '+money(n(r.f.week))+(r.f.tp>0?' · 止盈 '+r.f.tp+'%':' · 无止盈')+'</span></div>';
    h+='<div class="hc-sig" style="color:'+sigColor(r.s.level)+';background:'+sigBg(r.s.level)+'">'+r.s.label+'</div>';
    h+='</div><div class="hc-grid">';
    h+=hcItem('市值', r.mv==null?'--':money(r.mv), '');
    h+=hcItem('累计投入', r.cost>0?money(r.cost):'--', '');
    h+=hcItem('占比', share==null?'--':share.toFixed(1)+'%', '');
    h+=hcItem('持有收益', r.pnl==null?'--':((r.pnl>0?'+':'-')+money(Math.abs(r.pnl))), chgCls(r.pnl));
    h+=hcItem('收益率', r.pnlPct==null?'--':pct(r.pnlPct), chgCls(r.pnlPct));
    h+=hcItem('当日估算', r.dayAmt==null?'--':((r.dayAmt>0?'+':'')+r.dayAmt.toFixed(2)), chgCls(r.dayAmt));
    h+='</div><button class="hc-edit" onclick="editHold(\''+r.f.code+'\')">编辑份额与成本</button></div>';
  });
  h+='<div class="disc" style="margin-top:10px">持仓数据只保存在你本机浏览器（localStorage），不会上传到任何服务器。</div></div>';

  /* 资产配置 */
  if(holdSum>0){
    var COLORS=['#2f80ed','#f2994a','#27ae60','#9b51e0','#eb5757','#56ccf2','#f2c94c'];
    h+='<div class="pn"><h2>🥧 资产配置</h2><div class="tip">按当前市值占比。单一资产涨太多会挤出其他资产，靠新钱补给来再平衡。</div>';
    h+='<div class="alloc">';
    rows.forEach(function(r,i){ if(r.mv>0) h+='<i style="width:'+(r.mv/holdSum*100).toFixed(2)+'%;background:'+COLORS[i%COLORS.length]+'"></i>'; });
    h+='</div><div class="alloc-lb">';
    rows.forEach(function(r,i){ if(r.mv>0) h+='<span><i style="background:'+COLORS[i%COLORS.length]+'"></i>'+esc(shortName(r.f.name))+' '+(r.mv/holdSum*100).toFixed(1)+'%</span>'; });
    h+='</div></div>';

    /* 结构预警 */
    var DEF_KW=['黄金','白银','债','货币','对冲','商品','金'];
    function isDef(f){ var s=(f.name||'')+' '+(f.cat||''); for(var i=0;i<DEF_KW.length;i++){ if(s.indexOf(DEF_KW[i])>=0) return true; } return false; }
    var eqSum=0,defSum=0;
    rows.forEach(function(r){ if(r.mv>0){ if(isDef(r.f)) defSum+=r.mv; else eqSum+=r.mv; } });
    var eqPct=eqSum/holdSum*100, defPct=defSum/holdSum*100;
    var cap=n(cfg.holdCap,40), tot=n(cfg.totalCap,75);
    var alerts=[], bad=false;
    if(eqPct>tot){ bad=true; alerts.push('<b>权益暴露 '+eqPct.toFixed(1)+'%</b>，已超过你设定的上限 '+tot+'%。股市一旦回撤，组合会被同步拖累，新增资金应优先补给防守资产。'); }
    if(defPct<15){ bad=true; alerts.push('<b>防守资产仅 '+defPct.toFixed(1)+'%</b>（黄金/债券等）。压舱石不足，回撤平滑能力偏弱，建议逐步补到 20% 以上。'); }
    var over=rows.filter(function(r){ return r.mv>0 && (r.mv/holdSum*100)>cap; });
    if(over.length) alerts.push('<b>单只集中度偏高</b>：'+over.map(function(r){ return esc(shortName(r.f.name))+' '+(r.mv/holdSum*100).toFixed(1)+'%'; }).join('、')+'，超过你设定的单只上限 '+cap+'%。');
    if(!alerts.length) alerts.push('组合结构健康：权益与防守资产比例均衡，单只占比也在上限之内。');
    h+='<div class="'+(bad?'warn':'ok')+'" style="margin-top:9px">'+(bad?'⚠️ ':'✅ ')+alerts.join('<br>')+'</div>';

    /* 下一笔钱投向 */
    var picks=rows.filter(function(r){ return r.s.level==='go'&&r.mv>0; }).sort(function(a,b){ return (a.mv/holdSum)-(b.mv/holdSum); });
    if(picks.length){
      var p0=picks[0];
      h+='<div class="pn" style="margin-top:9px"><h2>💰 下一笔钱投向</h2>'
        +'<div class="tip" style="margin-bottom:6px">综合「位置便宜」与「当前低配」两个条件选出：</div>'
        +'<div style="font-size:13.5px;font-weight:800;color:#0a7d45;margin-bottom:4px">'+esc(p0.f.name)+'</div>'
        +'<div style="font-size:11.5px;color:var(--sub);line-height:1.6">买点评分 '+p0.s.score+'，当前占比 '+(p0.mv/holdSum*100).toFixed(1)+'%，建议本周投入 '+money(p0.s.detail.amount)+'。'
        +(eqPct>tot&&!isDef(p0.f)?'注意：它属于权益资产，加仓后权益比例会更高，建议同时留出部分资金给防守资产。':'可作为优先加仓对象。')
        +'</div></div>';
    }
  }
  document.getElementById('view-hold').innerHTML=h;
}

/* ── 搜索与添加 ──
   搜索状态提升为模块级变量：后台取数完成后会整体重绘「设置」页，
   若状态只存在 DOM 里，用户刚输入的搜索词与结果会被冲掉。 */
var SQ={ key:'', list:null, loading:false, note:'' };

function sresHtml(){
  if(SQ.note) return '<div class="empty" style="color:var(--go);font-weight:700">'+SQ.note+'</div>';
  if(SQ.loading) return '<div class="empty">'+(FUND_INDEX?'搜索中…':'首次载入基金清单（约 2MB，仅第一次）…')+'</div>';
  if(!SQ.list) return '';
  if(!SQ.list.length){
    return /^\d{6}$/.test(SQ.key)
      ? '<div class="empty">未找到该代码，可直接尝试添加：<button class="btn btn-p sm" style="margin-top:10px" onclick="addFund(\''+esc(SQ.key)+'\',\'\')">添加 '+esc(SQ.key)+'</button></div>'
      : '<div class="empty">没有找到匹配的场外基金<br>若已知 6 位代码，可直接添加：<button class="btn btn-p sm" style="margin-top:10px" onclick="addFund(\''+esc(SQ.key)+'\',\'\')">直接添加 '+esc(SQ.key)+'</button></div>';
  }
  var h='<div class="sres">', skipped=0;
  SQ.list.slice(0,12).forEach(function(x){
    if(isOnExchange(x.code)){          // 场内 ETF 没有场外净值，不能按这套指标跟踪
      skipped++;
      h+='<div class="it" style="opacity:.5;cursor:default"><div class="t">'+esc(x.name)+'</div>'
        +'<div class="c">'+x.code+' · 场内ETF</div></div>';
      return;
    }
    h+='<div class="it" onclick="addFund(\''+x.code+'\',\''+esc(x.name).replace(/'/g,'')+'\')">'
      +'<div class="t">'+esc(x.name)+'</div><div class="c">'+x.code+'</div></div>';
  });
  h+='</div>';
  if(skipped) h+='<div class="disc">灰色项是场内 ETF，请填它对应的场外联接基金代码（如 512890 对应 007466）。</div>';
  return h;
}
function refreshSres(){
  var b=document.getElementById('sres');
  if(b) b.innerHTML=sresHtml();
}
function doSearch(){
  var el=document.getElementById('skey');
  var k=((el&&el.value)||'').trim();
  if(!k || SQ.loading) return;
  SQ.key=k; SQ.list=null; SQ.loading=true; SQ.note='';
  refreshSres();
  searchFund(k).then(function(list){
    SQ.loading=false; SQ.list=list||[];
    refreshSres();
  });
}
function guessEtf(name){
  for(var i=0;i<ETF_MAP.length;i++){
    var m=ETF_MAP[i];
    for(var j=0;j<m.kw.length;j++){ if((name||'').indexOf(m.kw[j])>=0) return m.etf; }
  }
  return '';
}
/** 场内 ETF 代码判定：这些代码没有场外净值序列，不能用本页的指标口径跟踪 */
function isOnExchange(code){ return /^(51|52|56|58)\d{4}$/.test(code) || /^159\d{3}$/.test(code); }
function addFund(code,name){
  if(!/^\d{6}$/.test(code)){ alert('请输入 6 位场外基金代码'); return; }
  if(isOnExchange(code)){ alert('这是场内 ETF 代码（'+code+'），本页跟踪的是场外基金净值。\n\n请填它对应的场外联接基金代码，例如：\n512890 → 007466\n518880 → 000216'); return; }
  if(funds.some(function(f){ return f.code===code; })){ alert('该基金已在列表中：'+code); return; }
  var etf=guessEtf(name||'');
  funds.push({ code:code, name:name||code, etf:etf, cat:'', week:100, tp:0, shares:0, cost:0, on:true, maMode:'off' });
  saveFunds();
  SQ.key=''; SQ.list=null; SQ.note='已添加 '+esc(name||code)+'（'+(etf?'自动匹配场内 '+etf:'未匹配到场内ETF，仅用场外净值算指标')+'）';
  renderAll(); loadAll();
}
function editFund(i){
  var f=funds[i];
  var nm=prompt('基金名称：',f.name); if(nm===null) return;
  var wk=prompt('每周定投基准金额（元），用于计算建议加仓额：',f.week); if(wk===null) return;
  var tp=prompt('止盈线（%），填 0 表示不设止盈：',f.tp); if(tp===null) return;
  var etf=prompt('对应场内 ETF 代码（可选，如 sh512890，用于显示今日盘中参考）：',f.etf||''); if(etf===null) return;
  f.name=nm.trim()||f.name; f.week=n(wk); f.tp=n(tp); f.etf=(etf||'').trim();
  saveFunds(); renderAll();
}
function toggleFund(i){ funds[i].on=funds[i].on===false; saveFunds(); renderAll(); }
/* 年线档位开关：meanrev（参与金额决策） ↔ off（仅展示） */
function toggleMaMode(i){
  var f=funds[i]; if(!f) return;
  var st=maState(f,dataMap[f.code]);
  if(!st.on && f.maMode!=='meanrev'){
    if(st.dev==null){ alert('该基金净值还不足 250 个交易日，暂时算不出年线。'); return; }
    if(st.bars<MA_MIN_BARS){
      alert('该基金年线样本只有 '+st.valid+' 天（需要 2 年以上），现在启用没有统计意义，\n等它攒够两年历史再开。');
      return;
    }
    if(!confirm('「'+f.name+'」的年线关系尚未经过回测验证（黄金、宽基指数上分段检验结果不稳定）。\n\n仍要启用年线档位来调整加仓金额吗？')) return;
  }
  f.maMode = (f.maMode==='meanrev') ? 'off' : 'meanrev';
  saveFunds(); renderAll();
}
/* ── 年线补仓：按 code 定位基金（卡片按钮只带 code，不带下标，重绘后下标可能失效） ── */
function fundByCode(code){
  for(var i=0;i<funds.length;i++){ if(funds[i].code===code) return funds[i]; }
  return null;
}
/** 标记「已补到当前档」，把档位计数推到 k，并留一条流水 */
function maMarkPaid(code){
  var f=fundByCode(code); if(!f) return;
  var p=maPlan(f,dataMap[f.code]);
  if(!p.due.length){ alert('当前没有待补的档位。'); return; }
  var msg='确认已按这个方案补仓？\n\n'
    +'补仓金额：'+money(p.amount)+' 元\n'
    +'落档：−'+(p.k*p.cfg.step)+'% 档（本轮累计约 '+money(p.cum)+' 元）\n'
    +'算法：持仓市值 '+money(p.M)+' × ('+p.due.join('+')+')/'+p.cfg.unit+'\n\n'
    +'补完记得把新增份额填进「设置 → 我的基金 → 编辑」，否则持仓市值偏小、下次算出来的金额会偏低。';
  if(!confirm(msg)) return;
  if(!f.maPaid) f.maPaid={ max:0, log:[] };
  if(!f.maPaid.log) f.maPaid.log=[];
  f.maPaid.log.push({ d:today(), k:p.k, amt:Math.round(p.amount*100)/100, dev:+n(p.dev).toFixed(2) });
  if(f.maPaid.log.length>300) f.maPaid.log=f.maPaid.log.slice(-300);
  if(p.k>n(f.maPaid.max,0)) f.maPaid.max=p.k;
  saveFunds(); renderAll();
}
/** 结束本轮：净值回到年线上方后把档位计数归零，流水保留 */
function maResetCycle(code){
  var f=fundByCode(code); if(!f) return;
  var done=f.maPaid?n(f.maPaid.max,0):0;
  if(!confirm('结束本轮补仓？\n\n'
    +(done?('当前已补到 −'+done+'% 档。\n'):'')
    +'净值回到年线上方即视为一轮结束，档位计数归零，下一轮从 −1% 重新开始。\n'
    +'补仓流水会保留，只清空档位计数。')) return;
  if(!f.maPaid) f.maPaid={ max:0, log:[] };
  f.maPaid.max=0;
  f.maPaid.cycleAt=today();
  saveFunds(); renderAll();
}
function delFund(i){
  if(!confirm('确定删除「'+funds[i].name+'」？')) return;
  funds.splice(i,1); saveFunds(); renderAll();
}
function saveCfgForm(){
  cfg.holdCap=n(document.getElementById('c_holdCap').value,40);
  cfg.totalCap=n(document.getElementById('c_totalCap').value,75);
  var rfEl=document.getElementById('c_rf');
  if(rfEl) cfg.rf=n(rfEl.value,RF_DEF);
  _riskCache={};                      // 无风险利率变了，风险指标缓存作废
  saveCfg(); renderAll(); alert('已保存');
}
/** 保存年线补仓参数（步长 / 分母 / 上限），只作用于该只基金 */
function saveMaCfg(code){
  var f=fundByCode(code); if(!f) return;
  var es=document.getElementById('ma_step'), eu=document.getElementById('ma_unit'), ec=document.getElementById('ma_cap');
  if(!es||!eu||!ec) return;
  var st=n(es.value,MA_CFG_DEF.step), un=n(eu.value,MA_CFG_DEF.unit), cp=n(ec.value,MA_CFG_DEF.cap);
  if(!(st>0)) st=MA_CFG_DEF.step;
  if(!(un>1)) un=MA_CFG_DEF.unit;
  if(!(cp>=0)) cp=MA_CFG_DEF.cap;
  f.maCfg={ step:st, unit:un, cap:cp };
  saveFunds(); renderAll();
  alert('参数已保存：每 '+st+'% 一档，每档补「持仓市值 ÷ '+un+'」的整数倍，本轮累计上限 '+cp+' 倍市值。');
}
function exportData(){
  var blob=new Blob([JSON.stringify({funds:funds,cfg:cfg,ts:new Date().toISOString()},null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='神鸡妙算备份_'+today()+'.json';
  a.click();
}
function importData(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=function(){
    var file=inp.files[0]; if(!file) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var j=JSON.parse(fr.result);
        if(j.funds&&j.funds.length){
          funds=j.funds.map(function(f){ if(f.maMode===undefined) f.maMode='off'; return f; });
          saveFunds();
        }
        if(j.cfg){ cfg=j.cfg; saveCfg(); }
        renderAll(); loadAll(); alert('导入成功');
      }catch(e){ alert('导入失败：文件格式不正确'); }
    };
    fr.readAsText(file);
  };
  inp.click();
}
function clearCache(){
  try{ [LS_CACHE].concat(OLD_KEYS.cache).forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  dataMap={}; mktData=[];
  renderAll(); loadAll(true);
}
function resetAll(){
  if(!confirm('恢复默认将清空你添加的基金与持仓，确定继续？')) return;
  funds=JSON.parse(JSON.stringify(PRESET));
  cfg={holdCap:40,totalCap:75};
  saveFunds(); saveCfg(); renderAll(); loadAll();
}

/* ═══ 启动 ═══ */
loadLocal();
var _k=null;
try{
  var _qs=new URLSearchParams(location.search);
  var _v=_qs.get('view');
  if(_v&&VIEW_ALIAS[_v]) _v=VIEW_ALIAS[_v];              // 兼容 ?view=radar
  if(_v&&VIEWS.some(function(x){ return x.k===_v; })) curView=_v;
  var _fc=_qs.get('code');                                // ?code=007466 直达某只基金的二级页
  if(_fc){ fundPage=_fc; curView='dash'; }
  _k=_qs.get('skey');                                     // 支持 ?skey=007466 直达搜索结果
  if(_k){ curView='set'; fundPage=null; SQ.key=_k; }
}catch(e){}
renderAll();                       // 先用缓存/预置渲染，页面秒开
if(CACHE_TS) document.getElementById('stamp').textContent='显示缓存（'+new Date(CACHE_TS).toLocaleString('zh-CN')+'），正在更新…';
loadAll(false);                    // 再后台取真实数据
if(_k) setTimeout(doSearch, 300);
</script>
