<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>咸鱼WinWin · 测试版</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--border:#e4e7ed;--text:#1d1d2e;--sub:#8b92a0;--red:#e74c3c;--green:#27ae60;--blue:#2980b9;--orange:#f39c12;--yellow:#f1c40f;--purple:#8e44ad}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:12px 14px;max-width:480px;margin:0 auto;-webkit-font-smoothing:antialiased}
header{padding:14px 0 8px;text-align:center}
header h1{font-size:18px;font-weight:800;letter-spacing:-.4px}
header .st{font-size:11px;color:var(--sub);text-align:center;margin-top:2px}
.refresh-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;margin:8px 0 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:11px;color:var(--sub);cursor:pointer}
.tabs{display:flex;gap:3px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;background:var(--card);color:var(--sub)}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.dc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;position:relative;min-height:130px;margin-bottom:0}
.dc::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:2px 0 0 2px}
.dc.safe::before{background:var(--green)}.dc.warn::before{background:var(--orange)}.dc.danger::before{background:var(--red)}.dc.yellow::before{background:var(--yellow)}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.dc-top .name{font-size:13px;font-weight:700;line-height:1.2}
.dc-top .code{font-size:10px;color:var(--sub);margin-left:3px}
.dc-p{font-size:22px;font-weight:800;line-height:1.2}
.chip{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff}
.chip-up{background:#fde8e8;color:var(--red)}.chip-down{background:#e8f5e9;color:var(--green)}
.adv{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.a-buy{background:#e8f5e9;color:#1e8449}.a-wait{background:#fff8e0;color:#b8860b}.a-nop{background:#f0f2f5;color:var(--sub)}
.bar-track{height:4px;background:#eef0f4;border-radius:3px;position:relative;margin-top:3px}
.bar-fill{height:100%;border-radius:3px}
.bar-dot{position:absolute;width:8px;height:8px;border-radius:50%;top:-2px;transform:translateX(-50%);border:2px solid #fff}
.acc-item{border-bottom:1px solid var(--border);background:var(--card);border-radius:0}
.acc-item:first-child{border-top:1px solid var(--border)}
.acc-head{cursor:pointer;padding:14px 4px;display:flex;align-items:center;justify-content:space-between}
.acc-head .name{font-size:15px;font-weight:700;flex:1}
.acc-head .price{font-size:18px;font-weight:800;margin:0 10px}
.acc-head .chg{font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;min-width:50px;text-align:center}
.acc-head .arrow{font-size:14px;color:var(--sub);transition:.3s;min-width:20px;text-align:right}
.acc-head.open .arrow{transform:rotate(180deg)}
.acc-body{display:none;padding:0 12px 16px}
.acc-body.show{display:block}
.dl-section{margin-bottom:10px;background:var(--bg);padding:10px;border-radius:8px}
.dl-section h4{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;background:var(--card);padding:8px;border-radius:6px}
.m{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid #f8f9fb}
.m .k{color:var(--sub)}.m .v{font-weight:600}
.divseg-svg{width:100%;display:block;margin:6px 0}
.trend-svg{width:100%;height:90px;margin-top:6px;display:block}
.trend-legend{font-size:9px;color:var(--sub);margin-top:4px}
.trend-legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
.hist{display:flex;gap:3px;font-size:10px;color:var(--sub);flex-wrap:wrap;background:var(--card);padding:6px;border-radius:4px}
.hist span{background:#f0f2f5;padding:2px 5px;border-radius:3px}
.dates-row{display:flex;gap:12px;font-size:11px;color:var(--sub);padding:4px 0;background:var(--card);padding:8px;border-radius:4px}
.divcal{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.divcal th{font-size:10px;color:var(--sub);font-weight:400;padding:6px 4px;border-bottom:1px solid var(--border);background:#f8f9fa}
.divcal td{padding:8px 4px;border-bottom:1px solid #f0f2f5;font-size:11px;vertical-align:middle}
.stepper{display:inline-flex;align-items:center;gap:2px}
.stepper button{width:22px;height:22px;border:1px solid var(--border);background:var(--bg);border-radius:4px;cursor:pointer;font-weight:700;color:var(--text)}
.stepper button:active{background:var(--blue);color:#fff}
.stepper input{width:55px;padding:3px 4px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--text);text-align:center;font-size:12px;font-weight:600}
.cal-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.cal-row .hot{background:#fde8e8;color:var(--red);padding:1px 7px;border-radius:4px;font-size:9px;font-weight:600}
.opp-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.opp-stars{color:#f1c40f;font-size:10px;letter-spacing:2px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.panel h2{font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.hidden{display:none}
footer{text-align:center;padding:14px 10px;font-size:10px;color:var(--sub)}
</style>
</head>
<body>
<header>
<h1>🐟 咸鱼WinWin</h1>
<div class="st">做人如果没有梦想，跟咸鱼有什么分别</div>
<div class="refresh-bar" onclick="load()"><span id="time">加载中…</span> 🔄</div>
</header>

<div class="tabs">
<button class="on" data-tab="dash" onclick="switchTab(this,'dash')">🏠 首页</button>
<button data-tab="detail" onclick="switchTab(this,'detail')">🔍 个股</button>
<button data-tab="divcenter" onclick="switchTab(this,'divcenter')">💰 分红</button>
<button data-tab="opp" onclick="switchTab(this,'opp')">⭐ 机会</button>
</div>

<div id="dash"></div>
<div id="detail" class="hidden"></div>
<div id="divcenter" class="hidden"></div>
<div id="opp" class="hidden"></div>

<footer>东方财富API · 价值投资观察站</footer>

<script>
var shares={};
try{shares=JSON.parse(localStorage.getItem('vc_shares')||'{}');}catch(e){shares={};}

var CFG=[
{name:'中国平安',code:'601318',mkt:1,div:2.70,buy:50,tag:'周期',role:'周期弹性',roe:12.5,divHist:['2.50','2.55','2.55','2.55','2.70'],earn:'2026-08-28',divDt:'2026-10-20',cfo:1680,fcf:850,cov:3.4,safe:'🟢安全'},
{name:'招商银行',code:'600036',mkt:1,div:2.016,buy:37,tag:'稳定',role:'稳定底仓',roe:14.8,divHist:['1.52','1.74','1.97','2.00','2.02'],earn:'2026-08-22',divDt:'2027-01-15',cfo:1970,fcf:1180,cov:3.9,safe:'🟢安全'},
{name:'格力电器',code:'000651',mkt:0,div:3.00,buy:38,tag:'高息',role:'高股息',roe:18.2,divHist:['3.00','2.00','3.38','3.00','3.00'],earn:'2026-08-18',divDt:'2026-08-28',cfo:294,fcf:28,cov:1.7,safe:'🟡中等'},
{name:'中国移动',code:'600941',mkt:1,div:4.70,buy:88,tag:'缓冲',role:'波动缓冲',roe:10.5,divHist:['2.09','3.87','4.41','4.56','4.70'],earn:'2026-08-15',divDt:'2026-09-10',cfo:3091,fcf:1820,cov:3.0,safe:'🟢安全'},
];

var DIV_CAL=[
{s:'格力电器',t:'年报',d:'2026-08',p10:20,hot:1},
{s:'中国移动',t:'年报',d:'2026-09',p10:22},
{s:'中国平安',t:'中报',d:'2026-10',p10:9.5},
{s:'招商银行',t:'中报',d:'2027-01',p10:10},
];

var data=[];

function divLevel(d){if(d<5)return'danger';if(d<5.3)return'yellow';if(d<5.5)return'warn';return'safe'}
function divColor(d){if(d<5)return'var(--red)';if(d<5.3)return'var(--orange)';if(d<5.5)return'var(--yellow)';return'var(--green)'}
function divBarPct(d){if(d<=4)return 0;if(d>=6)return 100;return(d-4)/2*100}
function getAnn(code){for(var i=0;i<CFG.length;i++)if(CFG[i].code===code)return(shares[code]||0)*CFG[i].div;return 0}
function calcTotal(func){var t=0;for(var i=0;i<CFG.length;i++)t+=func(CFG[i].code);return t}
function advice(dist,divR){
  if(dist<0)return{text:'✅加仓',cls:'a-buy'};
  if(dist<=3&&divR>=5.3)return{text:'👀等回踩',cls:'a-wait'};
  if(dist<=7&&divR>=5)return{text:'⏳观察',cls:'a-wait'};
  return{text:'🚫不动',cls:'a-nop'};
}

async function fetchOne(mkt,code){
  var u='https://push2.eastmoney.com/api/qt/stock/get?secid='+mkt+'.'+code+'&fields=f43,f44,f45,f46,f50,f60,f162,f167,f116,f169&invt=2&fltt=2&_t='+Date.now();
  function timedFetch(url){
    return Promise.race([
      fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}}),
      new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},8000)})
    ]);
  }
  var ps=['https://corsproxy.io/?'+u, 'https://api.allorigins.win/raw?url='+encodeURIComponent(u), u];
  for(var i=0;i<ps.length;i++){
    try{
      var r=await timedFetch(ps[i]);
      if(r.ok){var j=await r.json();if(j&&j.data)return j.data}
    }catch(e){}
  }
  return null;
}

async function load(){
  document.getElementById('time').textContent='⏳ 加载中...';
  try{for(var i=0;i<CFG.length;i++){if(typeof shares[CFG[i].code]==='undefined')shares[CFG[i].code]=0;}}catch(e){}
  var promises=CFG.map(function(c){
    var row={name:c.name,code:c.code,role:c.role,tag:c.tag,div:c.div,buy:c.buy,roe:c.roe,divHist:c.divHist,earn:c.earn,divDt:c.divDt,cfo:c.cfo,fcf:c.fcf,cov:c.cov,safe:c.safe,price:0,prev:0,chg:0,pe:0,pb:0,mcap:0,divR:0,dist:0,needy:0,ok:false};
    return fetchOne(c.mkt,c.code).then(function(raw){
      if(raw&&raw.f43){
        row.price=raw.f43;row.prev=raw.f60||0;
        row.chg=row.prev>0?((row.price-row.prev)/row.prev*100):0;
        row.pe=raw.f162||0;row.pb=raw.f167||0;
        row.mcap=(raw.f116||0)/1e8;
        row.divR=c.div/row.price*100;
        row.dist=(row.price-c.buy)/c.buy*100;
        row.needy=c.buy-row.price;row.ok=true;
      }
      return row;
    }).catch(function(){return row});
  });
  data=await Promise.all(promises);
  try{renderAll();}catch(e){
    var d=document.getElementById('dash');
    if(d)d.innerHTML='<div style="background:#fee;border:1px solid #fcc;color:#c33;padding:12px;border-radius:8px;margin:12px;font-size:12px;white-space:pre-wrap">⚠️ 渲染异常：'+e.message+'\n'+(e.stack||'').split('\n').slice(0,3).join('\n')+'</div>';
  }
  document.getElementById('time').textContent=new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function getStockData(code){for(var i=0;i<data.length;i++)if(data[i].code===code)return data[i];return null}

function buildDivTrend(hist){
  var nums=hist.map(function(v){return parseFloat(v)});
  var w=320,h=80,padL=30,padR=8,padT=8,padB=20;
  var chartW=w-padL-padR,chartH=h-padT-padB;
  var maxN=Math.max.apply(null,nums),minN=Math.min.apply(null,nums);
  var range=maxN-minN||1;
  var pts=[];
  for(var i=0;i<nums.length;i++){
    var px=padL+(i+0.5)*(chartW/nums.length);
    var py=padT+chartH-((nums[i]-minN)/range)*chartH*0.85;
    pts.push(px.toFixed(1)+','+py.toFixed(1));
  }
  var svg='<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'">';
  svg+='<line x1="'+padL+'" y1="'+(padT+chartH*0.5)+'" x2="'+(w-padR)+'" y2="'+(padT+chartH*0.5)+'" stroke="#f0f2f5" stroke-width="0.5"/>';
  svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#2980b9" stroke-width="2"/>';
  for(var i=0;i<nums.length;i++){
    var px=padL+(i+0.5)*(chartW/nums.length);
    var py=padT+chartH-((nums[i]-minN)/range)*chartH*0.85;
    svg+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3" fill="#2980b9"/>';
    svg+='<text x="'+px.toFixed(1)+'" y="'+(py-7)+'" font-size="8" fill="#333" text-anchor="middle" font-weight="700">¥'+nums[i].toFixed(2)+'</text>';
    var yr=2026-nums.length+1+i;
    svg+='<text x="'+px.toFixed(1)+'" y="'+(h-6)+'" font-size="8" fill="#8b92a0" text-anchor="middle">'+String(yr).slice(2)+'</text>';
  }
  svg+='</svg>';
  var yoy=(nums[nums.length-1]-nums[nums.length-2])/nums[nums.length-2]*100;
  var yoyTxt=(yoy>=0?'📈 同比上涨':'📉 同比下跌')+Math.abs(yoy).toFixed(2)+'%';
  var yoyClr=yoy>=0?'var(--green)':'var(--red)';
  return svg+'<div style="margin-top:4px;text-align:center;font-size:11px;font-weight:700;color:'+yoyClr+'">'+yoyTxt+'</div>';
}

function renderAll(){
  var openIdx=[];
  document.querySelectorAll('.acc-head.open').forEach(function(el){
    var i=parseInt(el.parentNode.getAttribute('data-idx')||-1);
    if(i>=0)openIdx.push(i);
  });
  var activeTab=document.querySelector('.tabs button.on');
  var activeTabId=activeTab?activeTab.getAttribute('data-tab'):'dash';

  var ann=Math.round(calcTotal(getAnn));
  var dash='<div style="font-size:12px;color:var(--text);font-weight:700;text-align:center;padding:8px 0 4px">📈 股息率价值投资 · 今日判断</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  for(var i=0;i<data.length;i++){
    var r=data[i];
    if(!r.ok){dash+='<div class="dc"><div class="dc-top"><span class="name">'+r.name+'</span></div><div style="font-size:11px;color:var(--sub);padding:8px 0">数据加载中</div></div>';continue;}
    var up=r.chg>0,lvl=divLevel(r.divR),clr=divColor(r.divR),adv=advice(r.dist,r.divR),pct=divBarPct(r.divR);
    var nudge='';
    if(Math.abs(r.needy)<0.5)nudge='<span style="color:var(--green);font-weight:700">🎯 目标价范围内</span>';
    else if(r.needy>0)nudge='<span style="color:#2980b9;font-weight:700">低于目标 ¥'+r.needy.toFixed(2)+'</span>';
    else nudge='<span style="color:var(--red);font-weight:700">高于目标 ¥'+Math.abs(r.needy).toFixed(2)+'</span>';
    dash+='<div class="dc '+lvl+'" data-code="'+r.code+'" onclick="openStockDetail(this)" style="cursor:pointer">'+
      '<div class="dc-top">'+
        '<div><span class="name">'+r.name+'</span><span class="code"> '+r.code+'</span></div>'+
        '<span class="adv '+adv.cls+'">'+adv.text+'</span></div>'+
      '<div class="dc-p">¥'+r.price.toFixed(2)+' <span class="chip '+(up?'chip-up':'chip-down')+'">'+(up?'+':'')+r.chg.toFixed(2)+'%</span></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-top:3px"><span>股息率</span><b style="color:'+clr+'">'+r.divR.toFixed(2)+'%</b></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+clr+'"></div><div class="bar-dot" style="left:'+pct+'%;background:'+clr+'"></div></div>'+
      '<div style="font-size:10px;color:var(--sub);margin-top:4px">'+nudge+'</div></div>';
  }
  dash+='</div>';
  document.getElementById('dash').innerHTML=dash;

  var detail='<div style="margin-bottom:12px;font-size:11px;color:var(--sub)">点击股票行展开查看详细数据</div>';
  for(var i=0;i<data.length;i++){
    var r=data[i];
    if(!r.ok){detail+='<div class="acc-item" data-idx="'+i+'"><div class="acc-head"><span class="name">'+r.name+'</span><span style="font-size:11px;color:var(--sub)">加载中…</span><span class="arrow">▼</span></div></div>';continue;}
    var up=r.chg>0,clr=divColor(r.divR),pct=divBarPct(r.divR);
    var nudge=r.needy>0?'低于补仓 ¥'+r.needy.toFixed(2)+' ✅':(r.needy<0?'高于补仓 ¥'+Math.abs(r.needy).toFixed(2):'等于补仓价');
    var adv=r.needy>0?'已进入补仓区':r.dist<=5?'接近目标':'观望';

    // 分段条
    var rateVals=[6,5.5,5,4.5,4];
    var axesMin=r.div/0.07,axesMax=r.div/0.035;
    function pos(p){return Math.max(1,Math.min(99,(p-axesMin)/(axesMax-axesMin)*100))}
    var segColors=['#d0f0d8','#c8eccf','#e8f5e0','#fff8d0','#fde8e8'];
    var txtColors=['#27ae60','#27ae60','#7fb069','#e67e22','#e74c3c'];
    var svg='<svg class="divseg-svg" viewBox="0 0 400 110">';
    for(var kk=0;kk<5;kk++){
      var lP=pos(r.div/(rateVals[kk]/100)),rP=kk<4?pos(r.div/(rateVals[kk+1]/100)):99;
      svg+='<rect x="'+lP.toFixed(2)+'%" y="32" width="'+(rP-lP).toFixed(2)+'%" height="26" fill="'+segColors[kk]+'" rx="3"/>';
    }
    for(var kk=0;kk<5;kk++){
      var tX=pos(r.div/(rateVals[kk]/100));
      svg+='<line x1="'+tX.toFixed(2)+'%" y1="29" x2="'+tX.toFixed(2)+'%" y2="61" stroke="'+txtColors[kk]+'" stroke-width="1.2"/>';
      svg+='<text x="'+tX.toFixed(2)+'%" y="70" font-size="11" font-weight="700" fill="'+txtColors[kk]+'" text-anchor="middle">'+rateVals[kk].toFixed(1)+'%</text>';
      svg+='<text x="'+tX.toFixed(2)+'%" y="82" font-size="10" fill="#8b92a0" text-anchor="middle">'+(r.div/(rateVals[kk]/100)).toFixed(1)+'</text>';
    }
    var curPct=pos(r.price);
    var lbW=10,lbX=Math.max(2,Math.min(100-lbW,curPct-lbW/2));
    svg+='<polygon points="'+(curPct-4)+'%,0 '+(curPct+4)+'%,0 '+curPct.toFixed(2)+'%,18" fill="#e74c3c" stroke="#fff" stroke-width="1"/>';
    svg+='<rect x="'+lbX.toFixed(2)+'%" y="2" width="'+lbW.toFixed(2)+'%" height="16" rx="2" fill="#e74c3c"/>';
    svg+='<text x="'+((lbX+lbW/2)).toFixed(2)+'%" y="14" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">'+r.price.toFixed(2)+'</text>';
    svg+='<line x1="'+curPct.toFixed(2)+'%" y1="18" x2="'+curPct.toFixed(2)+'%" y2="31" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="2,2"/>';
    svg+='</svg>';

    // 营收净利
    var bars='',rev=null,np=null;
    if(r.code==='600036'){rev=[3313,3448,3391,3375,3300];np=[1200,1380,1466,1484,1502];}
    else if(r.code==='000651'){rev=[1897,1902,2050,1900,1711];np=[231,245,290,322,290];}
    else if(r.code==='601318'){rev=[11800,12200,9700,10300,11400];np=[1016,838,857,1267,1520];}
    else if(r.code==='600941'){rev=[8483,9373,10093,10408,10502];np=[1159,1255,1318,1384,1502];}
    if(rev){
      var rMax=Math.max.apply(null,rev),nMax=Math.max.apply(null,np);
      var w=320,h=90,padL=30,padR=8,padT=10,padB=18;
      var chartW=w-padL-padR,chartH=h-padT-padB;
      var barW=chartW/5*0.55;
      bars='<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'">';
      bars+='<line x1="'+padL+'" y1="'+(padT+chartH*0.6)+'" x2="'+(w-padR)+'" y2="'+(padT+chartH*0.6)+'" stroke="#f0f2f5" stroke-width="0.5"/>';
      for(var bi=0;bi<5;bi++){
        var bx=padL+(bi+0.5)*(chartW/5)-barW/2;
        var bh=Math.max(2,(rev[bi]/rMax)*chartH);
        bars+='<rect x="'+bx.toFixed(1)+'" y="'+(padT+chartH-bh).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="none" stroke="#5dade2" stroke-width="1.5" rx="2"/>';
        var revStr=rev[bi]>=10000?(rev[bi]/10000).toFixed(1)+'万':String(rev[bi]);
        bars+='<text x="'+(bx+barW/2).toFixed(1)+'" y="'+(padT+chartH-bh-4).toFixed(1)+'" font-size="7" fill="#333" text-anchor="middle" font-weight="600">'+revStr+'</text>';
      }
      var pts=[],npPos=[];
      for(var bi=0;bi<5;bi++){
        var px=padL+(bi+0.5)*(chartW/5);
        var py=padT+chartH-((np[bi]/nMax)*chartH*0.7);
        pts.push(px.toFixed(1)+','+py.toFixed(1));
        npPos.push({x:px,y:py,v:np[bi]});
      }
      bars+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#e67e22" stroke-width="2"/>';
      for(var bi=0;bi<5;bi++){
        var p=npPos[bi],isNeg=p.v<0;
        var cl=isNeg?'#e74c3c':'#e67e22';
        if(isNeg)bars+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="5" fill="none" stroke="#e74c3c" stroke-width="2"/>';
        bars+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(isNeg?5:3)+'" fill="'+cl+'"/>';
        var npStr=p.v>=10000?(p.v/10000).toFixed(1)+'万':String(p.v);
        var labelY=isNeg?(p.y+12):(p.y-7);
        bars+='<text x="'+p.x.toFixed(1)+'" y="'+labelY.toFixed(1)+'" font-size="7" fill="'+cl+'" text-anchor="middle" font-weight="700">'+(isNeg?'⚠':'')+npStr+'</text>';
      }
      for(var bi=0;bi<5;bi++){
        var lx=padL+(bi+0.5)*(chartW/5);
        bars+='<text x="'+lx.toFixed(1)+'" y="'+(h-4)+'" font-size="8" fill="#8b92a0" text-anchor="middle">'+['21','22','23','24','25'][bi]+'</text>';
      }
      bars+='</svg>';
    }

    detail+='<div class="acc-item" data-idx="'+i+'"><div class="acc-head" onclick="toggleAcc(this)">'+
      '<span class="name">'+(i+1)+'. '+r.name+'</span>'+
      '<span class="price">¥'+r.price.toFixed(2)+'</span>'+
      '<span class="chg '+(up?'chip-up':'chip-down')+'">'+(up?'+':'')+r.chg.toFixed(2)+'%</span>'+
      '<span class="arrow">▼</span></div>'+
    '<div class="acc-body">'+
      '<div class="dl-section"><h4>📈 估值</h4><div class="mg">'+
        '<div class="m"><span class="k">PE</span><span class="v">'+r.pe.toFixed(1)+'</span></div>'+
        '<div class="m"><span class="k">PB</span><span class="v">'+r.pb.toFixed(2)+'</span></div>'+
        '<div class="m"><span class="k">ROE</span><span class="v">'+r.roe.toFixed(1)+'%</span></div>'+
        '<div class="m"><span class="k">市值</span><span class="v">'+r.mcap.toFixed(0)+'亿</span></div>'+
      '</div></div>'+
      (bars?'<div class="dl-section"><h4>📊 营收 & 净利（亿）</h4><div class="trend-legend"><span class="dot" style="background:#5dade2"></span>营收 <span class="dot" style="background:#e67e22;margin-left:10px"></span>净利</div>'+bars+'</div>':'')+
      '<div class="dl-section"><h4>💰 现金流（亿）</h4><div class="mg">'+
        '<div class="m"><span class="k">经营现金流</span><span class="v">'+r.cfo+'</span></div>'+
        '<div class="m"><span class="k">自由现金流</span><span class="v">'+r.fcf+'</span></div>'+
        '<div class="m"><span class="k">现金/分红倍数</span><span class="v">'+r.cov+'倍</span></div>'+
        '<div class="m"><span class="k">安全评价</span><span class="v">'+r.safe+'</span></div>'+
      '</div></div>'+
      '<div class="dl-section"><h4>🎯 目标价分段</h4><div style="font-size:10px;color:var(--sub);margin-bottom:4px">'+nudge+' · '+adv+'</div>'+svg+'</div>'+
      '<div class="dl-section"><h4>📈 分红趋势</h4>'+buildDivTrend(r.divHist)+'</div>'+
      '<div class="dl-section"><h4>📅 事件</h4><div class="dates-row"><span>📊 财报：'+(r.earn||'—')+'</span><span>💵 分红：'+(r.divDt||'—')+'</span></div></div>'+
    '</div></div>';
  }
  document.getElementById('detail').innerHTML=detail;

  // 分红中心
  var totalCost=0,totalDiv=0,totalShares=0;
  var divs='<div class="panel"><h2>📊 分红计算器</h2>'+
    '<table class="divcal"><tr><th>股票</th><th style="text-align:right">目标股数</th><th style="text-align:right">预计成本</th><th style="text-align:right">每股分红</th><th style="text-align:right">实时股息率</th><th style="text-align:right">预估分红</th></tr>';
  for(var i=0;i<data.length;i++){
    var r=data[i];
    var sh=shares[r.code]||0;
    var cost=r.ok?sh*r.price:0,ad=r.div*sh;
    totalCost+=cost;totalDiv+=ad;totalShares+=sh;
    var yld=r.ok?(r.div/r.price*100).toFixed(2)+'%':'—';
    var yldClr=r.ok?(r.div/r.price*100>=5?'var(--green)':(r.div/r.price*100>=4?'var(--orange)':'var(--red)')):'var(--sub)';
    divs+='<tr>'+
      '<td><b>'+r.name+'</b><br><span style="font-size:9px;color:var(--sub)">¥'+(r.ok?r.price.toFixed(2):'—')+'</span></td>'+
      '<td style="text-align:right"><div class="stepper"><button onclick="stpShare(\''+r.code+'\',-100)">−</button><input type="number" value="'+sh+'" step="100" min="0" onchange="onShareChange(\''+r.code+'\',this.value)" id="i_'+r.code+'"><button onclick="stpShare(\''+r.code+'\',100)">+</button></div></td>'+
      '<td style="text-align:right;font-weight:600">¥'+cost.toLocaleString()+'</td>'+
      '<td style="text-align:right;color:var(--sub)">¥'+r.div.toFixed(2)+'</td>'+
      '<td style="text-align:right;font-weight:700;color:'+yldClr+'">'+yld+'</td>'+
      '<td style="text-align:right;color:var(--orange);font-weight:700">¥'+Math.round(ad).toLocaleString()+'</td>'+
    '</tr>';
  }
  divs+='<tr style="background:#f8f9fa;font-weight:700"><td>合计</td><td style="text-align:right">'+totalShares+' 股</td><td style="text-align:right">¥'+totalCost.toLocaleString()+'</td><td></td><td></td><td style="text-align:right;color:var(--orange)">¥'+Math.round(totalDiv).toLocaleString()+'</td></tr></table>'+
    '<div style="margin-top:10px;padding:8px 12px;background:#f8f9fa;border-radius:6px;font-size:11px;color:var(--sub)">点击 +/− 按钮调整股数（每次100），或直接输入数值。成本按实时股价估算。</div></div>'+
    '<div class="panel"><h2>📅 下次分红日历</h2>';
  for(var i=0;i<DIV_CAL.length;i++){
    var e=DIV_CAL[i];
    divs+='<div class="cal-row"><span><b>'+e.s+'</b>（'+e.t+'）</span><span style="color:var(--sub)">'+e.d+'</span><span>10派¥'+e.p10+'</span>'+(e.hot?'<span class="hot">本月</span>':'')+'</div>';
  }
  divs+='</div>';
  document.getElementById('divcenter').innerHTML=divs;

  // 机会排行
  var opps='<div class="panel"><h2>⭐ 下次机会</h2>';
  var sorted=data.slice().filter(function(r){return r.buy>0&&r.ok}).sort(function(a,b){return a.dist-b.dist});
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];
    var stars='',sc=r.dist<=0?5:r.dist<=3?4:r.dist<=5?3:r.dist<=8?2:1;
    for(var s=0;s<5;s++)stars+=s<sc?'★':'☆';
    var clr=r.dist<=5?'var(--green)':'var(--orange)';
    var needStr=r.needy>0?('需跌 ¥'+r.needy.toFixed(2)):'已在补仓区';
    opps+='<div class="opp-item"><span style="font-weight:700;min-width:24px">'+(i+1)+'.</span>'+
      '<div><div style="font-size:12px;font-weight:600">'+r.name+'</div><div style="font-size:10px;color:var(--sub)">¥'+(r.price>0?r.price.toFixed(2):'-')+' → ¥'+r.buy+' · '+needStr+'</div></div>'+
      '<div style="text-align:right"><div class="opp-stars">'+stars+'</div><div style="font-size:11px;font-weight:700;color:'+clr+'">'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</div></div></div>';
  }
  opps+='</div>';
  document.getElementById('opp').innerHTML=opps;

  openIdx.forEach(function(idx){
    var el=document.querySelector('[data-idx="'+idx+'"] .acc-head');
    if(el){el.classList.add('open');var body=el.nextElementSibling;if(body)body.classList.add('show');}
  });
  if(activeTabId){
    document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
    var at=document.querySelector('.tabs button[data-tab="'+activeTabId+'"]');if(at)at.classList.add('on');
    ['dash','detail','divcenter','opp'].forEach(function(k){var e=document.getElementById(k);if(e)e.classList.add('hidden')});
    var e=document.getElementById(activeTabId);if(e)e.classList.remove('hidden');
  }
}

function onShareChange(code,val){shares[code]=parseInt(val)||0;try{localStorage.setItem('vc_shares',JSON.stringify(shares))}catch(e){}renderAll();}
function stpShare(code,delta){var v=(shares[code]||0)+delta;if(v<0)v=0;shares[code]=v;try{localStorage.setItem('vc_shares',JSON.stringify(shares))}catch(e){}renderAll();}
function switchTab(btn,id){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  ['dash','detail','divcenter','opp'].forEach(function(k){var e=document.getElementById(k);if(e)e.classList.add('hidden')});
  var e=document.getElementById(id);if(e)e.classList.remove('hidden');
}
function toggleAcc(el){var body=el.nextElementSibling;body.classList.toggle('show');el.classList.toggle('open');}
function openStockDetail(el){
  var code=el.getAttribute('data-code');
  var idx=-1;for(var i=0;i<data.length;i++)if(data[i].code===code){idx=i;break;}
  if(idx<0)return;
  var tabs=document.querySelectorAll('.tabs button');
  for(var i=0;i<tabs.length;i++){if(tabs[i].getAttribute('data-tab')==='detail'){switchTab(tabs[i],'detail');break;}}
  setTimeout(function(){
    var accItem=document.querySelector('[data-idx="'+idx+'"]');
    if(accItem){
      var head=accItem.querySelector('.acc-head'),body=accItem.querySelector('.acc-body');
      if(head&&body){head.classList.add('open');body.classList.add('show');accItem.scrollIntoView({behavior:'smooth',block:'start'});}
    }
  },100);
}

window.addEventListener('error',function(e){
  var t=document.getElementById('time');
  if(t)t.textContent='⚠️ '+e.message;
  console.error('error',e);
});
window.addEventListener('unhandledrejection',function(e){
  var t=document.getElementById('time');
  if(t)t.textContent='⚠️ 加载失败：'+(e.reason?(e.reason.message||e.reason):'');
  console.error('reject',e.reason);
});

load();
</script>
</body>
</html>
